name: Build and deploy .NET Core application to Web App AgriStreamST10157545Practium20261106133549

on:
  push:
    branches:
      - master

env:
  AZURE_WEBAPP_NAME: AgriStreamST10157545Practium20261106133549
  AZURE_WEBAPP_PACKAGE_PATH: ./published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: .

jobs:
  build:
    environment: AgriStreamST10157545Practium20261106133549_Env
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"

      - name: Build
        run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build

      - name: Publish
        run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    environment: AgriStreamST10157545Practium20261106133549_Env
    runs-on: windows-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AgriStreamST10157545Practium20261106133549_CLIENT_ID_4786 }}
          tenant-id: ${{ vars.AgriStreamST10157545Practium20261106133549_TENANT_ID_1DA3 }}
          subscription-id: ${{ vars.AgriStreamST10157545Practium20261106133549_SUBSCRIPTION_ID_1DA3 }}

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@5cfb776471c748b351e1ebf5770e208a54ace016
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
