
name: Diagnose AgriStream Project Structure

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository
        shell: pwsh
        run: |
          Write-Host "===== REPOSITORY ROOT ====="
          Get-Location

          Write-Host "===== ROOT FILES AND FOLDERS ====="
          Get-ChildItem -Force | Select-Object Name, Mode

          Write-Host "===== ALL PROJECT FILES ====="
          Get-ChildItem -Path . -Recurse -Filter *.csproj -File |
            Select-Object -ExpandProperty FullName

          Write-Host "===== ALL SOLUTION FILES ====="
          Get-ChildItem -Path . -Recurse -File |
            Where-Object { $_.Extension -in '.sln', '.slnx' } |
            Select-Object -ExpandProperty FullName
